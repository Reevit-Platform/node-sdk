name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Publish
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      id-token: write   # mint the OIDC token npm trusts; enables provenance
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11   # OIDC needs npm >= 11.5.1; npm@11 still supports Node 20 (npm@latest/12 does not)

      - name: Install dependencies
        run: npm ci

      - name: Report dependency audit
        run: npm audit --audit-level=high || true

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Build
        run: npm run build

      - name: Verify checked-in dist is up to date
        run: |
          if [ -n "$(git ls-files 'dist/*' 'dist/**')" ]; then
            git diff --exit-code -- dist
          fi

      - name: Validate tracked package files
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, sys
          root = pathlib.Path('.')
          tracked = subprocess.check_output(['git', 'ls-files', '-z'], text=True).split('\0')
          errors = []
          for rel in filter(None, tracked):
              if rel.endswith('.gitkeep'):
                  continue
              path = root / rel
              if rel.endswith(('.new', '.tmp', '.bak', '.orig')):
                  errors.append(f"tracked temp file: {rel}")
              if path.is_file() and path.stat().st_size == 0:
                  errors.append(f"empty tracked file: {rel}")
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          PY

      - name: Publish to npm
        run: npm publish --access public
        # Authenticated via OIDC trusted publishing (no NODE_AUTH_TOKEN);
        # npm attaches build provenance automatically.
